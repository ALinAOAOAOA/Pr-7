name: Selenium Tests

# Запуск при каждом push в основную ветку и при pull request
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Получить код репозитория
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # На ubuntu-latest уже установлены Google Chrome и ChromeDriver,
      # а Selenium Manager подбирает совместимую версию драйвера сам.
      - name: Показать версию Chrome
        run: google-chrome --version

      - name: Запустить E2E-тесты (headless Chrome)
        run: pytest -v --html=report.html --self-contained-html

      # always(): отчёт нужен и тогда, когда тесты упали
      - name: Загрузить HTML-отчёт
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-report
          path: report.html
