<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>To-Do List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Список дел</h1>

    <div class="input-row">
      <input type="text" id="todo-input" placeholder="Новая задача" maxlength="100">
      <button id="add-btn" type="button">Добавить</button>
    </div>
    <p id="error" class="error" hidden>Введите текст задачи</p>

    <ul id="todo-list"></ul>

    <p id="counter">Осталось задач: 0</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
